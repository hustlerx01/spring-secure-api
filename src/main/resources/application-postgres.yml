spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/secureapi}
    username: ${DB_USER:secureapi}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # use Flyway/Liquibase migrations in production; see README limits
app:
  jwt:
    secret: ${APP_JWT_SECRET}
