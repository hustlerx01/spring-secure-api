spring:
  application:
    name: spring-secure-api
  datasource:
    url: jdbc:h2:mem:secureapi;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
  data:
    web:
      pageable:
        max-page-size: 100

server:
  error:
    include-stacktrace: never
    include-message: never

app:
  jwt:
    # Must be >= 32 bytes. Override with APP_JWT_SECRET in any real deployment.
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl-seconds: ${APP_JWT_TTL_SECONDS:900}
  lockout:
    max-failures: 5
    lock-seconds: 900
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
